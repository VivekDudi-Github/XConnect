version : "3.8"

services:
  backend:
    build:
      context: ./Backend
      dockerfile: node.Dockerfile
    init : true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # - 3000:3000
      - "4444:4444/udp"
    volumes:
      - ./Backend:/app
      - /app/node_modules # Avoid overwriting node_modules with the host's directory

  nginx:
    build:
      context: .
      dockerfile: nginx.dev.Dockerfile
    ports:
      - 80:80
      - 3000:443
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf


  redis:
    image: redis:7.4.9-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - 6379:6379
    