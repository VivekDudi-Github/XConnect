server {
    listen 80;
    server_name xconnect.ddns.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name xconnect.ddns.net;

    ssl_certificate /etc/letsencrypt/live/xconnect.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xconnect.ddns.net/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /serve/api/v1/stripe/webhook/ {
        proxy_pass_request_headers on; 
        
        proxy_pass http://backend:3000/;
        rewrite ^/serve/api/v1/stripe/webhook(.*) /api/v1/stripe/webhook$1 break;

        client_max_body_size 5M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /serve/ {
        proxy_pass http://backend:3000/;


        client_max_body_size 50M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}