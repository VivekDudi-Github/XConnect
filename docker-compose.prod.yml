services:
  backend:
    image: vivekdudi/xconnect-backend:latest
    restart: always
    init : true
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "44444:44444/udp"
      - "44444:44444/tcp"
    volumes:
      - /home/ubuntu/xconnect/uploads:/app/uploads
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

  nginx:
    image: vivekdudi/xconnect-nginx:latest
    restart: always
    ports:
      - 80:80
      - 443:443
    depends_on:
      - backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

  redis:
    image: redis:7.4.9-alpine
    restart: always
    volumes:
      - redis-volume:/data
    depends_on:
      - backend
    command: redis-server --appendonly yes
    
volumes:
  redis-volume: