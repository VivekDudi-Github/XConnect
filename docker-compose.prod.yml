
services:
  backend:
    image: vivekdudi/xconnect-backend:latest
    restart: always
    init : true
    env_file:
      - .env
    volumes:
      - /home/ubuntu/xconnect/uploads:/app/uploads


  nginx:
    image: vivekdudi/xconnect-nginx:latest
    restart: always
    ports:
      - 80:80
      - 443:443
    depends_on:
      - backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro


    